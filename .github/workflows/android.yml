# KiOVO Android ilovasini yig'adi: Play Store uchun AAB va telefonga
# to'g'ridan-to'g'ri o'rnatish uchun APK.
#
# Natija: Actions → shu ish → «Artifacts» → kiovo-android.
#
# IMZO KALITI (GitHub → Settings → Secrets and variables → Actions):
#   KIOVO_KEYSTORE_B64   — kalit fayli, base64 ko'rinishida
#   KIOVO_KEYSTORE_PAROL — kalit fayli paroli
#   KIOVO_KALIT_NOMI     — kalit nomi (alias), odatda «kiovo»
#   KIOVO_KALIT_PAROL    — kalit paroli (odatda fayl paroli bilan bir xil)
# Kalit qo'yilmagan bo'lsa VAQTINCHALIK kalit yasaladi — APK telefonda
# sinash uchun yaraydi, lekin Play'ga yuklab bo'lmaydi (har safar boshqa
# kalit bo'ladi). Play'ga faqat doimiy kalit bilan imzolangan AAB.
name: Android ilova

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      versiya:
        description: 'Versiya nomi (masalan 1.0.3)'
        required: false

jobs:
  yigish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK paketlari
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Imzo kaliti
        env:
          KEYSTORE_B64: ${{ secrets.KIOVO_KEYSTORE_B64 }}
          KEYSTORE_PAROL: ${{ secrets.KIOVO_KEYSTORE_PAROL }}
          KALIT_NOMI: ${{ secrets.KIOVO_KALIT_NOMI }}
          KALIT_PAROL: ${{ secrets.KIOVO_KALIT_PAROL }}
          # Doimiy kalitning kutilgan barmoq izi (src/config.js dagi androidSha256)
          KUTILGAN_IZ: "4C:9F:81:B6:F7:BF:5F:5F:5E:2F:91:60:07:7E:CF:93:F6:D1:04:6A:A3:04:46:AA:D4:A3:A5:3F:D8:B9:4D:25"
        run: |
          KS="$RUNNER_TEMP/kiovo.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "::add-mask::$KEYSTORE_PAROL"
            echo "::add-mask::$KALIT_PAROL"
            # Telefondan nusxalanganda matnga bo'sh joy, qator uzilishi yoki
            # «data:...;base64,» qo'shilib qolishi mumkin — hammasi tozalanadi.
            if [ ${#KEYSTORE_B64} -lt 300 ] && printf '%s' "$KEYSTORE_B64" | grep -qiE '\.(txt|jks|keystore)[[:space:]]*$'; then
              echo "::error title=KIOVO_KEYSTORE_B64 ga fayl NOMI yozilgan::Secret'da fayl nomi turibdi, ichidagi matn emas. kiovo-upload.jks.base64.txt faylini oching, ichidagi uzun matnni (3528 belgi, MIIK... bilan boshlanadi) to'liq nusxalab secret qiymatiga qo'ying."
              exit 1
            fi
            TOZA=$(printf '%s' "$KEYSTORE_B64" | sed 's/^data:[^,]*,//' | tr -- '-_' '+/' | tr -cd 'A-Za-z0-9+/=')
            UZ=${#TOZA}
            echo "Kalit matni: $UZ belgi (kutilgan: 3528)"
            if ! printf '%s' "$TOZA" | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
              echo "::error title=KIOVO_KEYSTORE_B64 buzilgan::Secret'dagi matn base64 emas yoki to'liq emas ($UZ belgi, kerak 3528). kiovo-upload.jks.base64.txt faylini oching, Ctrl+A → Ctrl+C bilan HAMMASINI nusxalab, secret'ni qayta saqlang."
              exit 1
            fi
            echo "Kalit fayli: $(stat -c %s "$KS") bayt (kutilgan: 2646)"
            NOM="${KALIT_NOMI:-kiovo}"
            KP="${KALIT_PAROL:-$KEYSTORE_PAROL}"
            if ! ROYXAT=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PAROL" 2>&1); then
              if printf '%s' "$ROYXAT" | grep -qi 'password'; then
                echo "::error title=KIOVO_KEYSTORE_PAROL noto'g'ri::Kalit fayli o'qildi, lekin parol mos kelmadi. KIOVO_KEYSTORE_PAROL ni qayta kiriting (boshida/oxirida bo'sh joy qolmasin)."
              else
                echo "::error title=KIOVO_KEYSTORE_B64 to'liq emas::Kalit matni $UZ belgi (kerak 3528) — fayl buzilgan. kiovo-upload.jks.base64.txt ichidagi matnni to'liq nusxalab secret'ni qayta saqlang."
              fi
              exit 1
            fi
            if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PAROL" -alias "$NOM" > /dev/null 2>&1; then
              echo "::error title=KIOVO_KALIT_NOMI noto'g'ri::Kalit omborida «$NOM» nomli kalit yo'q. KIOVO_KALIT_NOMI qiymati: kiovo"
              exit 1
            fi
            if printf '%s' "$ROYXAT" | grep -qi 'PKCS12'; then
              # PKCS12 da kalit paroli ombor paroli bilan bir xil bo'ladi
              if [ "$KP" != "$KEYSTORE_PAROL" ]; then
                echo "::warning::KIOVO_KALIT_PAROL ombor parolidan farq qiladi — PKCS12 kalitida ular bir xil, ombor paroli ishlatildi."
              fi
              KP="$KEYSTORE_PAROL"
            elif ! keytool -certreq -keystore "$KS" -storepass "$KEYSTORE_PAROL" -alias "$NOM" -keypass "$KP" -file /dev/null > /dev/null 2>&1; then
              echo "::error title=KIOVO_KALIT_PAROL noto'g'ri::Kalit paroli mos kelmadi. KIOVO_KALIT_PAROL ni qayta kiriting."
              exit 1
            fi
            IZ=$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PAROL" -alias "$NOM" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
            if [ "$IZ" != "$KUTILGAN_IZ" ]; then
              echo "::warning title=Boshqa kalit::Bu kalitning izi ($IZ) saytdagi izdan farq qiladi. Admin panel → Sozlamalar → Android ilova ga shu izni qo'shmasangiz ilovada manzil satri ko'rinadi."
            fi
            echo "KIOVO_KEYSTORE_PAROL=$KEYSTORE_PAROL" >> "$GITHUB_ENV"
            echo "KIOVO_KALIT_NOMI=$NOM" >> "$GITHUB_ENV"
            echo "KIOVO_KALIT_PAROL=$KP" >> "$GITHUB_ENV"
            echo "KALIT_TURI=doimiy" >> "$GITHUB_ENV"
          else
            P="vaqtinchalik-$(openssl rand -hex 8)"
            echo "::add-mask::$P"
            keytool -genkeypair -keystore "$KS" -storepass "$P" -keypass "$P" -alias kiovo \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KiOVO sinov" > /dev/null 2>&1
            echo "KIOVO_KEYSTORE_PAROL=$P" >> "$GITHUB_ENV"
            echo "KIOVO_KALIT_NOMI=kiovo" >> "$GITHUB_ENV"
            echo "KIOVO_KALIT_PAROL=$P" >> "$GITHUB_ENV"
            echo "KALIT_TURI=vaqtinchalik" >> "$GITHUB_ENV"
            echo "::warning::Imzo kaliti sozlanmagan — vaqtinchalik kalit ishlatildi. APK sinash uchun yaraydi, Play'ga yuklab bo'lmaydi."
          fi
          echo "KIOVO_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Yig'ish (AAB + APK)
        working-directory: android
        env:
          VERSIYA_KODI: ${{ github.run_number }}
          VERSIYA_NOMI: ${{ github.event.inputs.versiya || format('1.0.{0}', github.run_number) }}
        run: gradle --no-daemon --stacktrace bundleRelease assembleRelease

      # Ilova AYNAN www.kiovo.shop ni ochishini yig'ilgan fayllardan tekshiradi.
      # www siz domen boshqa saytga olib boradi — xato domenli APK chiqmasin.
      - name: Domen tekshiruvi (www.kiovo.shop)
        working-directory: android/app/build
        run: |
          MAN=$(find intermediates -path '*release*' -name AndroidManifest.xml | xargs grep -l 'trusted.DEFAULT_URL' | head -1)
          RES=$(find generated intermediates -name 'gradleResValues.xml' -path '*release*' | head -1)
          echo "manifest: $MAN"; echo "resurs: $RES"
          test -n "$MAN" && test -n "$RES"
          grep -o 'https://[a-z.]*/app/' "$MAN" | sort -u
          grep -o 'site[^,}]*' "$RES"
          grep -q 'android:value="https://www.kiovo.shop/app/"' "$MAN"
          grep -q 'android:host="www.kiovo.shop"' "$MAN"
          grep -q 'https://www.kiovo.shop' "$RES"
          ! grep -E 'https://kiovo\.shop|host="kiovo\.shop"' "$MAN" "$RES"
          echo "✅ Ilova www.kiovo.shop ni ochadi" >> "$GITHUB_STEP_SUMMARY"

      - name: Imzo barmoq izi (assetlinks uchun)
        run: |
          IZ=$(keytool -list -v -keystore "$KIOVO_KEYSTORE" -storepass "$KIOVO_KEYSTORE_PAROL" \
               -alias "$KIOVO_KALIT_NOMI" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          {
            echo "## KiOVO Android — ${KALIT_TURI} kalit"
            echo ""
            echo "SHA-256 barmoq izi (admin panel → Sozlamalar → Android ilova):"
            echo ""
            echo "\`$IZ\`"
            echo ""
            echo "Play App Signing yoqilgach Play Console → App integrity dagi izni ham qo'shing."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IZ" > android/app/build/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kiovo-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/sha256.txt
          if-no-files-found: error
