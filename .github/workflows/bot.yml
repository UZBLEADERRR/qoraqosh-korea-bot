name: Code check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node.js 20 o‘rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaksis va katalog testini bajarish
        run: |
          npm test
          node --check bot.js

      - name: Railway konfiguratsiyasi haqida eslatma
        run: |
          echo "Bot Railway'da ishlaydi. BOT_TOKEN va GEMINI_API_KEY Railway Variables ichida saqlanadi."
          echo "GitHub Actions bu yerda botni polling qilmaydi."
