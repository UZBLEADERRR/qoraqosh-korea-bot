name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tekshir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bog'liqliklarni o'rnatish
        run: npm ci || npm install
      - name: Sintaksis va tuzilma tekshiruvi
        run: |
          for f in $(find src scripts -name '*.js'); do node --check "$f"; done
          for f in public/app/app.js public/admin/admin.js; do node --check "$f"; done
          node scripts/check.js
