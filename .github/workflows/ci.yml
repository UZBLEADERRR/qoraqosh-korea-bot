name: Node.js Test & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: setup-node@v4
      with:
        node-version: '20.x'
    - name: Run Syntax & Product Tests
      run: |
        node --check server.js
        node --check data/products.js
        npm test
