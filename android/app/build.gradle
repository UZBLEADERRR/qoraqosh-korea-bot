plugins {
    id 'com.android.application'
}

// Versiya CI dan keladi: har yig'ishda raqam oshadi — Play bir xil
// versionCode ni ikkinchi marta qabul qilmaydi.
def versiyaKodi = (System.getenv('VERSIYA_KODI') ?: '1') as int
def versiyaNomi = System.getenv('VERSIYA_NOMI') ?: '1.0.0'

// Ilova ochadigan sayt — YAGONA joy. «www» SHART: www siz kiovo.shop
// boshqa saytga olib boradi. Manifest (ochiladigan manzil, havolalar) va
// assetStatements shu qiymatdan olinadi. Yorliqlar (res/xml/shortcuts.xml)
// placeholder qo'llamaydi — u yerda ham xuddi shu domen yozilgan, sinov
// (test/operatsiya.mjs) ikkalasi bir xilligini tekshiradi.
def ilovaDomeni = 'www.kiovo.shop'

// Imzo kaliti CI dagi maxfiy o'zgaruvchilardan. Kalit fayli repozitoriyga
// HECH QACHON qo'yilmaydi.
def kalitFayli = System.getenv('KIOVO_KEYSTORE')

android {
    namespace 'shop.kiovo.app'
    compileSdk 36

    defaultConfig {
        applicationId 'shop.kiovo.app'
        minSdk 21
        targetSdk 36
        versionCode versiyaKodi
        versionName versiyaNomi

        manifestPlaceholders = [ilovaDomeni: ilovaDomeni]
        // Ilova shu saytga egalik qilishini e'lon qiladi. Sayt tomoni:
        // https://www.kiovo.shop/.well-known/assetlinks.json
        resValue 'string', 'assetStatements', """[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://${ilovaDomeni}\\"}}]"""
    }

    signingConfigs {
        release {
            if (kalitFayli) {
                storeFile file(kalitFayli)
                storePassword System.getenv('KIOVO_KEYSTORE_PAROL')
                keyAlias System.getenv('KIOVO_KALIT_NOMI') ?: 'kiovo'
                keyPassword System.getenv('KIOVO_KALIT_PAROL') ?: System.getenv('KIOVO_KEYSTORE_PAROL')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (kalitFayli) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Ilovada o'z kodi yo'q — kutubxona lint ogohlantirishlari yig'ishni to'xtatmasin
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
