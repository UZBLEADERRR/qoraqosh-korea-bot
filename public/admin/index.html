<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ab0a0c">
<title>KiOVO — Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/umumiy/brend.css">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ============ KIRISH ============ -->
<div id="kirish" class="kirish yashirin">
  <div class="quti">
    <div class="logo">__LOGO__</div>
    <h1>Admin panel</h1>
    <div class="izoh">KiOVO boshqaruvi</div>

    <div id="tg-quti" class="yashirin">
      <button class="tug asos keng" id="t-tg-kirish">📱 Telegram orqali kirish</button>
      <div class="ajratgich">yoki parol bilan</div>
    </div>

    <form id="kirish-forma">
      <label for="k-login">Login</label>
      <input id="k-login" autocomplete="username" autocapitalize="off" required>
      <label for="k-parol">Parol</label>
      <input id="k-parol" type="password" autocomplete="current-password" required>
      <div id="kirish-xato" class="xato"></div>
      <button class="tug asos keng" style="margin-top:18px">Kirish</button>
    </form>
  </div>
</div>

<!-- ============ PANEL ============ -->
<!-- Karkas: chapda menyu (kompyuter), tepada sarlavha + qidiruv + AI,
     pastda tab menyu (telefon). Ikonlar SVG — JS `data-ik` dan chizadi. -->
<div id="panel" class="karkas yashirin">

  <aside class="yon" aria-label="Menyu">
    <div class="yon-bosh">
      <span class="brend">__LOGO__</span>
      <button class="yon-kichik" id="t-yon-kichik" aria-label="Menyuni yig‘ish"><i data-ik="panel"></i></button>
    </div>
    <button class="ai-katta" data-ai><i data-ik="ai"></i><span>AI yordamchi</span><kbd>/</kbd></button>
    <nav class="yon-nav">
      <div class="yon-guruh">Asosiy</div>
      <button data-b="boshqaruv" class="faol"><i data-ik="uy"></i><span>Boshqaruv</span></button>
      <button data-b="buyurtma"><i data-ik="quti"></i><span>Buyurtmalar</span><em id="yon-nishon" class="nishon yashirin">0</em></button>
      <button data-b="mahsulot"><i data-ik="teg"></i><span>Mahsulotlar</span></button>
      <button data-b="mijoz"><i data-ik="odamlar"></i><span>Mijozlar</span></button>
      <div class="yon-guruh">Savdo</div>
      <button data-b="sotuv"><i data-ik="osish"></i><span>Sotuvlar</span></button>
      <button data-b="manba"><i data-ik="magnit"></i><span>Manbalar</span></button>
      <button data-b="xarid"><i data-ik="royxat"></i><span>Xarid ro‘yxati</span></button>
      <button data-b="ombor"><i data-ik="ombor"></i><span>Omborlar</span></button>
      <button data-b="market"><i data-ik="globus"></i><span>Marketplace</span></button>
      <div class="yon-guruh">Do‘kon</div>
      <button data-b="bolim"><i data-ik="papka"></i><span>Bo‘limlar</span></button>
      <button data-b="xabar"><i data-ik="xat"></i><span>Xabarlar</span></button>
      <button data-b="sozlama"><i data-ik="sozlama"></i><span>Sozlamalar</span></button>
      <button data-b="tizim"><i data-ik="puls"></i><span>Tizim holati</span></button>
      <button data-b="qollanma"><i data-ik="kitob"></i><span>Qo‘llanma</span></button>
    </nav>
    <button class="chiq" id="t-chiq-yon"><i data-ik="chiqish"></i><span>Chiqish</span></button>
  </aside>

  <div class="ish-joyi">
    <header class="tepa">
      <span class="tepa-belgi">__BELGI__</span>
      <h1 id="tepa-nom">Boshqaruv</h1>
      <span class="oraliq"></span>
      <button class="qidir-tugma" id="t-qidir" aria-label="Qidirish"><i data-ik="qidir"></i><span>Qidirish…</span><kbd>Ctrl K</kbd></button>
      <button class="ik-tugma" id="t-yangila" aria-label="Yangilash"><i data-ik="yangila"></i></button>
      <button class="ai-mini" data-ai aria-label="AI yordamchi"><i data-ik="ai"></i><span>AI</span></button>
      <button class="ik-tugma yashirin" id="t-kop" aria-label="Ko‘proq"><i data-ik="menyu"></i></button>
    </header>
    <main id="tan"></main>
  </div>

  <nav class="past-menyu" aria-label="Asosiy bo‘limlar">
    <button data-b="boshqaruv" class="faol"><i data-ik="uy"></i>Boshqaruv</button>
    <button data-b="buyurtma"><i data-ik="quti"></i>Buyurtma<em id="past-nishon" class="nishon yashirin">0</em></button>
    <button class="past-ai" data-ai aria-label="AI yordamchi"><span><i data-ik="ai"></i></span></button>
    <button data-b="mahsulot"><i data-ik="teg"></i>Mahsulot</button>
    <button id="t-kop2"><i data-ik="menyu"></i>Menyu</button>
  </nav>
</div>

<div id="modal" class="modal yashirin">
  <div class="parda" data-yop></div>
  <div class="oyna"><div class="dasta"></div><div id="modal-tan"></div></div>
</div>

<script src="/app/hududlar.js"></script>
<script src="admin.js"></script>
</body>
</html>
