<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buyurtmalar — KiOVO</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/buyurtma/style.css">
</head>
<body>

<!-- ══ KIRISH ══ -->
<div class="kirish" id="kirish" hidden>
  <form class="kirish-quti" id="kirish-forma">
    <div class="kirish-belgi">KiOVO</div>
    <h1>Buyurtmalar</h1>
    <label for="k-login">Login</label>
    <input id="k-login" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="k-parol">Parol</label>
    <input id="k-parol" type="password" autocomplete="current-password">
    <div class="kirish-xato" id="kirish-xato" hidden></div>
    <button class="tug asos keng" type="submit" id="k-kir">Kirish</button>
  </form>
</div>

<!-- ══ ISH STOLI ══ -->
<div class="ish" id="ish" hidden>

  <header class="tepa">
    <button class="ikon-tug faqat-tor" id="t-menyu" aria-label="Bo‘limlar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a class="belgi" href="/buyurtma/">KiOVO<span>Buyurtmalar</span></a>

    <div class="qidiruv">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"
        stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M13.5 13.5 17 17"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Raqam, ism yoki telefon"
        autocomplete="off" spellcheck="false">
    </div>

    <button class="ikon-tug" id="t-yangila" aria-label="Yangilash" title="Yangilash">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path
        d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3v3.5H13"
        stroke="currentColor" stroke-width="1.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ikon-tug" id="t-chiq" aria-label="Chiqish" title="Chiqish">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path
        d="M12 6V4H4v12h8v-2M9 10h8m0 0-2.5-2.5M17 10l-2.5 2.5"
        stroke="currentColor" stroke-width="1.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="tan">
    <!-- Yon ustun: ish navbatlari va bosqichlar -->
    <aside class="yon" id="yon">
      <div class="yon-guruh">
        <p class="yon-sarlavha">Ish navbati</p>
        <nav id="navbatlar"></nav>
      </div>
      <div class="yon-guruh">
        <p class="yon-sarlavha">Bosqich</p>
        <nav id="bosqichlar"></nav>
      </div>
    </aside>
    <div class="yon-parda" id="yon-parda" hidden></div>

    <main class="royxat" id="royxat">
      <div class="yuklanmoqda" id="yuklanmoqda"><span class="aylana"></span></div>
    </main>
  </div>

  <!-- Belgilangan buyurtmalar uchun pastki panel -->
  <div class="tanlov-panel" id="tanlov-panel" hidden>
    <span id="tanlov-soni">0 ta tanlandi</span>
    <button class="tug" id="t-tanlovni-bekor">Bekor</button>
    <button class="tug asos" id="t-kochir">Keyingi bosqichga</button>
  </div>
</div>

<!-- Tafsilot: keng ekranda o'ng panel, telefonda to'liq ekran -->
<div class="panel-parda" id="panel-parda" hidden></div>
<section class="panel" id="panel" hidden aria-label="Buyurtma tafsiloti"></section>

<div class="oyna-parda" id="oyna-parda" hidden></div>
<div class="oyna" id="oyna" hidden role="dialog" aria-modal="true"></div>

<script src="/buyurtma/app.js"></script>
</body>
</html>
