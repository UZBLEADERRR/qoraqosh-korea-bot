<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QoraQosh Korea</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <div class="logo">QoraQosh</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="katalog">Katalog</div>
    <div class="tab" data-tab="savat">
      Savat
      <span id="cart-badge" class="cart-badge" hidden>0</span>
    </div>
    <div class="tab" data-tab="profil">Profil</div>
  </div>

  <div id="view-katalog">
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="🔍 Mahsulot yoki brend qidirish..." autocomplete="off">
    </div>
    <div id="categories" class="categories"></div>
    <div id="product-grid" class="grid"></div>
  </div>

  <div id="view-savat" class="hidden">
    <div id="cart-empty" class="hidden" style="text-align:center; padding:40px 16px; color:#666;">
      <div style="font-size:50px; margin-bottom:16px;">🛒</div>
      <p>Savat bo'sh. Katalogdan mahsulot tanlang.</p>
      <button class="add-btn" style="width:auto; padding:10px 20px;" onclick="tabOzgardi('katalog')">Katalogga o'tish</button>
    </div>
    <div id="cart-list" class="cart-list" style="padding:0 16px;"></div>
    <div id="cart-footer" class="hidden" style="padding:16px; border-top:1px solid #333; margin-bottom:80px;">
      <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:800; margin-bottom:16px;">
        <span>Jami:</span>
        <span id="total-price" style="color:var(--accent);">0 so'm</span>
      </div>
      <button id="order-btn" class="footer-btn">Buyurtma berish</button>
    </div>
  </div>

  <div id="view-profil" class="hidden">
    <div class="profile-card">
      <div style="font-size:18px; font-weight:800; margin-bottom:4px;">Sizning tahlilingiz</div>
      <div style="font-size:12px; color:var(--accent); margin-bottom:12px;">Gemini AI tomonidan tahlil qilingan</div>
      <div id="analysis-result"></div>
    </div>
    <div style="padding:16px; color:#666; font-size:12px; text-align:center;">
      Yangi tahlil uchun botga yuz rasmini yuboring.
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="close-btn" data-close-modal>×</div>
      <div class="modal-img"></div>
      <div class="modal-title"></div>
      <div class="modal-price"></div>
      <div id="modal-details"></div>
      <div style="height:80px;"></div>
      <button class="footer-btn modal-add">Savatga qo'shish</button>
    </div>
  </div>

  <script src="products-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
